<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let p1=new Promise((resolve,reject)=>setTimeout(()=>reject('Task 1 incomplete'),2000))
        let p2=new Promise((resolve)=>setTimeout(()=>resolve('Task 2 complete'),3000))
        let p3=new Promise((resolve)=>setTimeout(()=>resolve('Task 3 complete'),1000))

        Promise.any([p1,p2,p3])
        .then((result)=>console.log(result))
        .catch((error)=>console.log(error))
    </script>
</body>
</html>
