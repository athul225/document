<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Product Detail</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .product-details {
      background: #fffffe;
      padding: 20px;
      /* max-width: 500px; */
      margin: auto;
    }
    img {
      max-width: 100%;
      height: auto;
      display: block; 
      margin: auto;
    }
  </style>
</head>
<body>
  <div class="product-details" id="productDetails">Loading...</div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');

    if (productId) {
      fetch(`https://dummyjson.com/products/${productId}`)
        .then(response => response.json())
        .then(product => {
          const container = document.getElementById('productDetails');
          container.innerHTML = `
            <h1 style="text-align:center">${product.title}</h1>
            <img src="${product.thumbnail}" alt="${product.title}">
            <p><strong>Description:</strong> ${product.description}</p>
            <p><strong>Brand:</strong> ${product.brand}</p>
            <p><strong>Category:</strong> ${product.category}</p>
            <p><strong>Price:</strong> $${product.price}</p>
            <p><strong>Rating:</strong> ${product.rating} stars</p>
            <p><strong>Stock:</strong> ${product.stock} units</p>
            <p><strong>Discount:</strong> ${product.discountPercentage}%</p>
          `;
        })
        .catch(error => console.log(error));
    } else {
      document.getElementById('productDetails').textContent = 'Product ID not found.';
    }
  </script>
</body>
</html>
